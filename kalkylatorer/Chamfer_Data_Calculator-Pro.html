<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chamfer Milling Calculator Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FOUC fix: Apply the correct theme on <html> BEFORE the page is rendered. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* localStorage may be blocked */ }
        })();
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>

<body>
<div class="container">
    <button class="theme-toggle" id="themeToggle">🌙</button>
   
    <header>
        <div class="tool-badge tool-hm" id="toolBadge">HM</div>
        <h1>Chamfer Milling Calculator Pro</h1>
        <p class="subtitle">Cutting Data for Chamfer Milling based on Effective Diameter (D<sub>eff</sub>)</p> 
    </header>
    <main>
        <div class="section-title">Geometry & Material</div>
        
        <div class="form-group">
            <label for="material">Material:<span class="tooltip" data-tooltip="Select the workpiece material. Controls Vc and the fz table." tabindex="0">?</span></label>
            <select id="material">
                <!-- Options are populated dynamically from toolData -->
            </select>
        </div>

        <div class="form-group">
            <label for="toolAngle">Tool Included Angle θ [°]:<span class="tooltip" data-tooltip="The tool's full included angle (tip angle). 90° is the most common for chamfering." tabindex="0">?</span></label>
            <select id="toolAngle">
                <option value="60">60°</option>
                <option value="82">82°</option>
                <option value="90" selected>90°</option>
                <option value="100">100°</option>
                <option value="120">120°</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="chamferSize">Chamfer Size [mm] (Horizontal width):<span class="tooltip" data-tooltip="Desired chamfer width, measured horizontally from the material's edge inward." tabindex="0">?</span></label>
            <input type="number" id="chamferSize" value="1.0" step="0.1" min="0.1">
        </div>
        
        <div class="form-group">
            <label for="extraZ">Extra Z Depth [mm] (Beyond required depth):<span class="tooltip" data-tooltip="Extra depth beyond what the chamfer width requires. Increases D_eff and thereby fz." tabindex="0">?</span></label>
            <input type="number" id="extraZ" value="0.0" step="0.1" min="0">
        </div>

        <hr>
        <div class="section-title">Cutting Data (Editable)</div>
        <div class="form-group">
            <label for="vc">Cutting Speed Vc [m/min]:<span class="tooltip" data-tooltip="Cutting speed. Automatically adjusted based on the selected material." tabindex="0">?</span></label>
            <input type="number" id="vc" value="150" step="10">
        </div>
        <div class="form-group">
            <label for="fzBase">Base Feed Per Tooth f<sub>z,bas</sub> [mm/z]:<span class="tooltip" data-tooltip="Base feed per tooth. Adjusted for D_eff unless you edit it manually." tabindex="0">?</span></label>
            <input type="number" id="fzBase" value="0.032" step="0.001">
        </div>
        <div class="form-group">
            <label for="z">Number of Flutes z:<span class="tooltip" data-tooltip="Number of cutting edges on the tool." tabindex="0">?</span></label>
            <input type="number" id="z" value="4" step="1">
        </div>
        <div class="form-group">
            <label for="maxRpm">Max RPM:<span class="tooltip" data-tooltip="Maximum machine spindle speed. Limits N if the calculated speed exceeds this." tabindex="0">?</span></label>
            <input type="number" id="maxRpm" value="8000" step="100">
        </div>
        
        <!-- ============================================================ -->
        <!-- RESULTS                                                        -->
        <!-- ============================================================ -->
        <div class="results" id="results">
            <p style="color:var(--text-light); text-align:center; padding:20px 0;">
                Fill in the fields above to get cutting data
            </p>
        </div>
    </main>
</div>
<footer>Chamfer Milling Calculator Pro – created by Jimmy Rauhala</footer>

<script src="Chamfer_tool_data.js"></script>

<script>
    // =====================================================================
    // Helper functions
    // =====================================================================
    const parseValue = (id, defaultValue = 0) => {
        const value = parseFloat(document.getElementById(id).value);
        return isNaN(value) ? defaultValue : value;
    };
    
    const formatDecimal = (num, fixed) => {
        if (isNaN(num)) return "N/A";
        const s = num.toFixed(fixed);
        return s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
    };

    const userEdited = {vc: false, fz: false, z: false};

    // =====================================================================
    // Populate material dropdown from toolData
    // =====================================================================
    function generateMaterialOptions() {
        const select = document.getElementById('material');
        select.innerHTML = '';

        for (const key in toolData) {
            if (Object.prototype.hasOwnProperty.call(toolData, key)) {
                const option = new Option(toolData[key].name, key);
                if (key === 'steel1080') option.selected = true;
                select.options.add(option);
            }
        }
    }

    // =====================================================================
    // Main calculation and result rendering
    // =====================================================================
    function calculate() {
        const chamfer_size = parseValue('chamferSize');
        const angle = parseValue('toolAngle');
        const extraZ = parseValue('extraZ');
        const Vc = parseValue('vc');
        const fz_bas = parseValue('fzBase');
        const z = Math.round(parseValue('z', 1));
        const maxRpm = parseValue('maxRpm');

        const resultsEl = document.getElementById('results');

        // Input validation
        if (chamfer_size < 0.1 || extraZ < 0 || Vc <= 0 || z <= 0 || fz_bas <= 0
            || typeof runCalculations === 'undefined') {
            resultsEl.classList.remove('ready');
            resultsEl.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:20px 0;">Please enter valid cutting data to calculate results.</p>';
            return;
        }

        const res = runCalculations(chamfer_size, angle, extraZ, Vc, fz_bas, z, maxRpm);

        // Render results
        resultsEl.classList.add('ready');
        resultsEl.innerHTML = `
            <h2>Results</h2>
            <div class="result-line"><strong>Spindle Speed N [rpm]:<span class="tooltip" data-tooltip="Calculated spindle speed. Red text = limited by Max RPM." tabindex="0">?</span></strong> <span class="value ${res.isCapped ? 'capped' : ''}">${Math.round(res.n)}</span></div>
            <div class="result-line"><strong>V<sub>f</sub> (Finish) [mm/min]:<span class="tooltip" data-tooltip="Conservative feed for fine surface finish (fz × 0.6)." tabindex="0">?</span></strong> <span class="value">${res.Vf_finish}</span></div>
            <div class="result-line"><strong>V<sub>f</sub> (Internal/Std) [mm/min]:<span class="tooltip" data-tooltip="Base feed without chip thinning." tabindex="0">?</span></strong> <span class="value">${res.Vf_std}</span></div>
            <div class="result-line"><strong>V<sub>f</sub> (External/Prod) [mm/min]:<span class="tooltip" data-tooltip="Aggressive feed with chip thinning compensation." tabindex="0">?</span></strong> <span class="value">${res.Vf_prod}</span></div>
            
            <div class="details-box">
                <p><strong>D<sub>eff</sub>:<span class="tooltip" data-tooltip="Effective diameter at engagement (largest diameter in the material)." tabindex="0">?</span></strong><span>${formatDecimal(res.D_eff, 3)} <sub>mm</sub></span></p> 
                <p><strong>Z-depth (required):<span class="tooltip" data-tooltip="Z-depth required to achieve the desired chamfer width." tabindex="0">?</span></strong><span>${formatDecimal(res.Z_req, 3)} <sub>mm</sub></span></p>
                <p><strong>Z-depth (total):<span class="tooltip" data-tooltip="Total Z-depth including extra depth." tabindex="0">?</span></strong><span>${formatDecimal(res.Z_total, 3)} <sub>mm</sub></span></p>
                <p><strong>Radial Engagement ae:<span class="tooltip" data-tooltip="Radial engagement in the side direction. Equal to chamfer_size." tabindex="0">?</span></strong><span>${formatDecimal(res.ae, 3)} <sub>mm</sub></span></p>
                <p><strong>Chip thinning factor:<span class="tooltip" data-tooltip="Compensation factor for thinner chips. Cap: 2.0." tabindex="0">?</span></strong><span>${formatDecimal(res.chip_thinning, 3)} <sub>(x)</sub></span></p>
                <p><strong>Finish f<sub>z</sub>:<span class="tooltip" data-tooltip="Feed per tooth for fine surface finish (fz_bas × 0.6)." tabindex="0">?</span></strong><span>${formatDecimal(res.fz_finish, 4)} <sub>mm/z</sub></span></p>
                <p><strong>Std. f<sub>z</sub>:<span class="tooltip" data-tooltip="Base fz without compensation." tabindex="0">?</span></strong><span>${formatDecimal(res.fz_std, 4)} <sub>mm/z</sub></span></p>
                <p><strong>Prod. f<sub>z</sub> (chip thinning):<span class="tooltip" data-tooltip="fz with chip thinning compensation." tabindex="0">?</span></strong><span>${formatDecimal(res.fz_prod, 4)} <sub>mm/z</sub></span></p>
                <p><strong>Vc:<span class="tooltip" data-tooltip="Actual cutting speed. May deviate from the desired value if N was limited." tabindex="0">?</span></strong><span>${formatDecimal(res.actualVc, 1)} <sub>m/min</sub></span></p> 
            </div>
        `;
    }

    // =====================================================================
    // Default values per material
    // =====================================================================
    function updateStandardValuesAndCalculate() {
        if (typeof toolData === 'undefined' || typeof getFzFromTable === 'undefined'
            || typeof calculateDeff === 'undefined') {
            calculate();
            return;
        }

        const mat = document.getElementById('material').value;
        const matData = toolData[mat];
        if (!matData) return;

        const chamfer_size = parseValue('chamferSize');
        const angle = parseValue('toolAngle');
        const extraZ = parseValue('extraZ');

        const D_eff = calculateDeff(chamfer_size, angle, extraZ);
        const default_fz = getFzFromTable(mat, D_eff);

        if (!userEdited.vc) document.getElementById('vc').value = matData.vc;
        if (!userEdited.fz) document.getElementById('fzBase').value = formatDecimal(default_fz, 4);
        if (!userEdited.z) document.getElementById('z').value = matData.z_base;

        calculate();
    }

    // =====================================================================
    // Tooltip positioning
    // =====================================================================
    function positionTooltip(el) {
        const rect = el.getBoundingClientRect();
        const bubbleWidth = Math.min(220, window.innerWidth - 16);
        const bubbleHeight = 90;
        const padding = 8;
        const gap = 8;
        const vw = window.innerWidth;

        let centerX = rect.left + rect.width / 2;
        if (centerX - bubbleWidth / 2 < padding) {
            centerX = padding + bubbleWidth / 2;
        } else if (centerX + bubbleWidth / 2 > vw - padding) {
            centerX = vw - padding - bubbleWidth / 2;
        }

        let topY = rect.top - bubbleHeight - gap;
        if (topY < padding) {
            topY = rect.bottom + gap;
        }

        el.style.setProperty('--tt-x', centerX + 'px');
        el.style.setProperty('--tt-y', topY + 'px');
    }

    // =====================================================================
    // Initialization
    // =====================================================================
    document.addEventListener('DOMContentLoaded', () => {
        // Populate material dropdown from toolData
        generateMaterialOptions();

        // Tooltip listeners via event delegation
        // Handles tooltips created dynamically inside the results box.
        document.addEventListener('mouseover', (e) => {
            const el = e.target.closest('.tooltip');
            if (el) positionTooltip(el);
        });
        document.addEventListener('focusin', (e) => {
            const el = e.target.closest('.tooltip');
            if (el) positionTooltip(el);
        });
        document.addEventListener('touchstart', (e) => {
            const el = e.target.closest('.tooltip');
            if (el) positionTooltip(el);
        }, { passive: true });

        window.addEventListener('scroll', () => {
            document.querySelectorAll('.tooltip:hover, .tooltip:focus').forEach(positionTooltip);
        }, { passive: true });

        window.addEventListener('resize', () => {
            document.querySelectorAll('.tooltip:hover, .tooltip:focus').forEach(positionTooltip);
        });

        // Input listeners
        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', () => {
            if (el.id === 'vc') userEdited.vc = true;
            if (el.id === 'fzBase') userEdited.fz = true;
            if (el.id === 'z') userEdited.z = true;
            calculate();
        }));

        document.getElementById('material').addEventListener('change', updateStandardValuesAndCalculate);
        document.getElementById('chamferSize').addEventListener('input', updateStandardValuesAndCalculate);
        document.getElementById('toolAngle').addEventListener('change', updateStandardValuesAndCalculate);
        document.getElementById('extraZ').addEventListener('input', updateStandardValuesAndCalculate);
        document.getElementById('maxRpm').addEventListener('input', calculate);

        updateStandardValuesAndCalculate();
    });
</script>
<script src="theme.js"></script>
</body>
</html>
